<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,"PingFang SC",sans-serif;background:#b9e5fa;color:white}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}#game{position:relative;margin:auto;width:100%;max-width:520px;height:100%;overflow:hidden;background:linear-gradient(#83bfff,#8cecf3);touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:absolute;top:max(28px,env(safe-area-inset-top));left:20px;right:20px;display:grid;grid-template-columns:48px 1fr 75px;align-items:center;gap:12px;pointer-events:none}.icon{pointer-events:auto;width:46px;height:46px;border:1.5px solid #ffffffa8;border-radius:50%;color:white;background:#426b7044;font-size:24px;backdrop-filter:blur(8px)}.level{text-align:center;font-size:25px;letter-spacing:3px;font-weight:400}.coins{background:#45686b55;border-radius:25px;padding:8px 10px;font-size:18px;white-space:nowrap}.coin{display:inline-grid;place-items:center;width:22px;height:22px;background:linear-gradient(#ffe288,#ecad22);border:2px solid #e8ae28;border-radius:50%;color:#a47012;font-size:13px;font-weight:bold}.progress{position:absolute;top:96px;width:54%;left:23%;height:12px;background:#506b7044;border:2px solid #ffffffe6;border-radius:15px;overflow:hidden}.fill{width:0;height:100%;background:linear-gradient(#ffe677,#eebe1f);border-radius:10px;transition:width .12s}.keys{position:absolute;top:96px;right:18px;color:#426c6f;font-size:20px;letter-spacing:3px}.keys b{color:#ffc742}.tag{position:absolute;left:-1px;top:145px;padding:11px 20px 11px 16px;border:2px solid white;border-left:0;background:linear-gradient(#27c9e4,#00a0c8);border-radius:0 35px 35px 0;box-shadow:0 5px #597d7b55;font-size:20px}.timer{position:absolute;left:18px;top:245px;width:59px;height:59px;background:#412669;border:2px solid white;border-radius:50%;display:grid;place-items:center;font-size:14px;box-shadow:0 5px 20px #32324b18}.message{position:absolute;top:139px;left:110px;right:25px;text-align:center;font-size:18px;text-shadow:0 2px 9px #35555366;opacity:0;transition:opacity .25s}.hint{position:absolute;bottom:max(58px,calc(env(safe-area-inset-bottom) + 35px));left:0;right:0;text-align:center;pointer-events:none;transition:opacity .3s}.hint strong{display:block;font-weight:500;font-size:20px;text-shadow:0 1px 7px #30464155}.hint small{display:block;margin-top:9px;font-size:12px;color:#537977;letter-spacing:2px}.gesture{width:2px;height:36px;background:linear-gradient(transparent,white);margin:0 auto 16px;position:relative;animation:guide 1.8s infinite}.gesture:after{content:"";position:absolute;width:9px;height:9px;border-bottom:2px solid white;border-right:2px solid white;transform:rotate(45deg);bottom:0;left:-4px}@keyframes guide{0%,100%{transform:translateY(-6px);opacity:.4}60%{transform:translateY(7px);opacity:1}}.footer{position:absolute;bottom:16px;left:0;right:0;font-size:10px;letter-spacing:4px;color:#537270;text-align:center;pointer-events:none}.overlay{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;background:#163d3d18;backdrop-filter:blur(0px);padding:24px 22px max(42px,env(safe-area-inset-bottom));}.overlay.show{display:flex}.card{width:100%;border:1px solid #ffffffb5;background:#ffffffec;box-shadow:0 18px 55px #27494a30;border-radius:24px;padding:23px;text-align:center;color:#244c4e}.card .eyebrow{font-size:11px;letter-spacing:4px;color:#799492}.card h1{font-size:27px;margin:9px 0}.card p{font-size:14px;color:#6b8683;margin:0 0 19px}.primary{border:0;background:#109c9e;color:white;border-radius:15px;padding:15px 25px;min-height:48px;width:100%;font-weight:600;box-shadow:0 5px 0 #087b80}.secondary{background:transparent;border:0;padding:14px;color:#688582;min-height:44px}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#82adb1;font-size:18px}#settings{align-items:center;background:#163d3d33;backdrop-filter:blur(6px)}#settings .card{max-width:360px}#settings h1{margin-bottom:22px}#settings label{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;font-size:15px}input[type=checkbox]{width:22px;height:22px;accent-color:#109c9e}@media(max-height:660px){.top{top:16px}.progress,.keys{top:78px}.tag{top:112px}.message{top:112px}.timer{top:195px}.hint{bottom:44px}.hint small{margin-top:5px}}

#game{max-width:min(520px,calc(100dvh * .46))}/* Reference proportions: compact HUD, oval stage, blade tool tab. */
.top{top:28px;left:12px;right:12px;grid-template-columns:38px 1fr 72px}.icon{width:34px;height:34px;font-size:20px;background:#5b898b55;border-width:1.5px}.level{font-size:23px;letter-spacing:2px}.coins{font-size:18px;padding:3px 8px}.progress{top:75px;height:10px;width:46%;left:27%}.keys{top:76px;right:12px;font-size:17px}.tag{top:106px;padding:5px 10px 4px 8px;border-radius:0 28px 28px 0}.timer{top:260px;left:10px;width:58px;height:58px}.message{top:112px;left:86px;font-size:18px}.hint{bottom:40px}.hint strong{font-size:16px}.hint small{font-size:10px;letter-spacing:1px}.footer{display:none}.card{padding:18px;border-radius:20px}.overlay{padding-bottom:24px}.overlay .card h1{font-size:25px}

#result{padding-bottom:16px}#result .card{padding:12px;border-radius:16px}#result .eyebrow{display:none}#result .card h1{font-size:19px;margin:0}#result .card p{font-size:12px;margin:5px 0 10px}#result .primary{width:62%;min-height:44px;padding:10px;font-size:14px}#result .secondary{width:35%;min-height:44px;padding:10px 3px;font-size:13px}
.coins,.keys,.tag,.timer{display:none}.top{display:flex;justify-content:space-between;align-items:center;top:22px;left:20px;right:20px}.level{font-size:18px;letter-spacing:.5px;color:#923a64}.icon{color:#923a64;border-color:#b9588277;background:#fff4fa88}.progress{top:65px;height:6px;border:0;background:#b9588233}.fill{background:#e9639c}.hint strong,.hint small{color:#923a64;text-shadow:none}.message{color:#923a64;text-shadow:none}.primary{background:#df6798;box-shadow:0 5px #b94775}.card{color:#823655}.secondary{color:#a1446a}body{background:#f9dce9}#game{background:#f7cadd}
.level,.message{display:none}</style>
</head><body><main id="game">
<div class="top"><button class="icon" id="gear" aria-label="Settings">⚙</button><div class="level" id="level">Level 1</div><div class="coins"><span id="coins">25</span> <span class="coin">♛</span></div></div>

<div id="loading">Preparing soap…</div>
</main><script type="module" src="./game.js?v=61-ray-celebration"></script></body></html>
